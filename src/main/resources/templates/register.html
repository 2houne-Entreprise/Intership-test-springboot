<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Register - TaskFlow</title>
</head>
<body>
  <h1>Create an account</h1>

  <form th:action="@{/register}" th:object="${registerForm}" method="post">
    <div>
      <label for="username">Username</label>
      <input type="text" id="username" th:field="*{username}">
      <span th:if="${#fields.hasErrors('username')}" th:errors="*{username}" style="color:red"></span>
    </div>
    <div>
      <label for="password">Password</label>
      <input type="password" id="password" th:field="*{password}">
      <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" style="color:red"></span>
    </div>
    <button type="submit">Register</button>
  </form>

  <p>Already registered? <a th:href="@{/login}">Log in</a></p>
</body>
</html>
