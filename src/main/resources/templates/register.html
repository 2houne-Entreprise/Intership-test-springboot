<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head><title>Register - TaskFlow</title></head>
<body>
<section>
  <h1>Create an account</h1>
  <form th:action="@{/register}" th:object="${registerForm}" method="post">
    <div>
      <label for="username">Username</label>
      <input type="text" id="username" th:field="*{username}">
      <span th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="field-error"></span>
    </div>
    <div>
      <label for="password">Password</label>
      <input type="password" id="password" th:field="*{password}">
      <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="field-error"></span>
    </div>
    <button type="submit">Register</button>
  </form>
  <p>Already registered? <a th:href="@{/login}">Log in</a></p>
</section>
</body>
</html>
