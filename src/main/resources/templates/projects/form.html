<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head><title>Project - TaskFlow</title></head>
<body>
<section>
  <h1>Project</h1>
  <form th:action="@{${formAction}}" th:object="${projectForm}" method="post">
    <div>
      <label for="name">Name</label>
      <input type="text" id="name" th:field="*{name}">
      <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="field-error"></span>
    </div>
    <div>
      <label for="description">Description</label>
      <textarea id="description" th:field="*{description}" rows="4"></textarea>
    </div>
    <button type="submit">Save</button>
    <a th:href="@{/projects}">Cancel</a>
  </form>
</section>
</body>
</html>
