<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Projects - TaskFlow</title>
</head>
<body>
  <h1>My projects</h1>
  <p th:if="${success}" th:text="${success}" style="color:green"></p>

  <p><a th:href="@{/projects/new}">New project</a> | <a th:href="@{/dashboard}">Dashboard</a></p>

  <p th:if="${#lists.isEmpty(projects)}">No projects yet.</p>

  <table th:unless="${#lists.isEmpty(projects)}" border="1" cellpadding="6">
    <tr><th>Name</th><th>Description</th><th>Actions</th></tr>
    <tr th:each="project : ${projects}">
      <td th:text="${project.name}"></td>
      <td th:text="${project.description}"></td>
      <td>
        <a th:href="@{/projects/{id}/edit(id=${project.id})}">Edit</a>
        <form th:action="@{/projects/{id}/delete(id=${project.id})}" method="post" style="display:inline">
          <button type="submit">Delete</button>
        </form>
      </td>
    </tr>
  </table>
</body>
</html>
