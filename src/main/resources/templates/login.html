<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Login - TaskFlow</title>
</head>
<body>
  <h1>Login</h1>

  <p th:if="${param.error}" style="color:red">Invalid username or password.</p>
  <p th:if="${param.logout}" style="color:green">You have been logged out.</p>
  <p th:if="${success}" th:text="${success}" style="color:green"></p>

  <form th:action="@{/login}" method="post">
    <div>
      <label for="username">Username</label>
      <input type="text" id="username" name="username" required>
    </div>
    <div>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>
    </div>
    <button type="submit">Log in</button>
  </form>

  <p>No account? <a th:href="@{/register}">Register</a></p>
</body>
</html>
