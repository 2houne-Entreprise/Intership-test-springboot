<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Tasks - TaskFlow</title>
</head>
<body>
  <h1>Tasks of <span th:text="${project.name}"></span></h1>
  <p th:if="${success}" th:text="${success}" style="color:green"></p>

  <p>
    <a th:href="@{/projects/{id}/tasks/new(id=${project.id})}">New task</a> |
    <a th:href="@{/projects}">Back to projects</a>
  </p>

  <p th:if="${#lists.isEmpty(tasks)}">No tasks yet.</p>

  <table th:unless="${#lists.isEmpty(tasks)}" border="1" cellpadding="6">
    <tr><th>Title</th><th>Status</th><th>Deadline</th><th>Actions</th></tr>
    <tr th:each="task : ${tasks}">
      <td th:text="${task.title}"></td>
      <td th:text="${task.status}"></td>
      <td th:text="${task.deadline}"></td>
      <td><a th:href="@{/projects/{pid}/tasks/{id}/edit(pid=${project.id},id=${task.id})}">Edit</a></td>
    </tr>
  </table>
</body>
</html>
