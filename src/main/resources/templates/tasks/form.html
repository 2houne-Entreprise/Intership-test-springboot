<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Task - TaskFlow</title>
</head>
<body>
  <h1>Task</h1>

  <form th:action="@{${formAction}}" th:object="${taskForm}" method="post">
    <div>
      <label for="title">Title</label>
      <input type="text" id="title" th:field="*{title}">
      <span th:if="${#fields.hasErrors('title')}" th:errors="*{title}" style="color:red"></span>
    </div>
    <div>
      <label for="status">Status</label>
      <select id="status" th:field="*{status}">
        <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option>
      </select>
      <span th:if="${#fields.hasErrors('status')}" th:errors="*{status}" style="color:red"></span>
    </div>
    <div>
      <label for="deadline">Deadline</label>
      <input type="date" id="deadline" th:field="*{deadline}">
      <span th:if="${#fields.hasErrors('deadline')}" th:errors="*{deadline}" style="color:red"></span>
    </div>
    <button type="submit">Save</button>
    <a th:href="@{/projects/{id}/tasks(id=${projectId})}">Cancel</a>
  </form>
</body>
</html>
